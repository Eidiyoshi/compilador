<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title>Compilador</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>Analisador Léxico</h1>

        <section class="upload">
            <label for="abcdef">Arquivo de entrada:</label>
            <input type="file" id="abcdef"/>
        </section>

        <textarea name="campoTexto" style="min-width: 900px; min-height: 50px;" id="campoTexto"></textarea>
        <button onclick="lerSemArquivo()" >Analisar</button>

        <section class="result">
            <h2>Tabela de Tokens</h2>

            <table id="tokensTable">
                <thead>
                    <tr>
                        <th>Token</th>
                        <th>Value</th>
                        <th>Line</th>
                        <th>Start</th>
                        <th>End</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </section>
    </div>

    <script src="Lexico.js"></script>
</body>
