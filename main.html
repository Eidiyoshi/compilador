<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title>Compilador</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>Compilador</h1>

        <section class="editor">
            <h2>Editor de Código</h2>

            <section class="upload">
                <label for="inputFile">Arquivo de entrada:</label>
                <input type="file" id="inputFile"/>
            </section>

            <section class="code-editor">
                <div class="lines-wrapper">
                    <div class="line-numbers" id="lines"></div>
                </div>
                <textarea name="inputField" id="inputField"></textarea>
            </section>

            <section class="button">
                <button id="startButton">Analisar código</button>
            </section>
        </section>

        <div class="tabs">
            <button class="tab-btn active" onclick="openTab(event, 'Tab1')">Analisador Léxico</button>
            <button class="tab-btn" onclick="openTab(event, 'Tab2')">Analisador Sintático</button>
        </div>

        <div id="Tab1" class="tab-content active">
            <section class="result">
                <h2>Tabela de Símbolos</h2>

                <table id="tokensTable">
                    <thead>
                        <tr>
                            <th>Token</th>
                            <th>Lexema</th>
                            <th>Linha</th>
                            <th>Começo</th>
                            <th>Fim</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </section>
        </div>

        <div id="Tab2" class="tab-content">
            <section class="result">
                <h2>Pilha de Símbolos</h2>
                <div id="stackView" class="stack-view"></div>
            </section>

            <section class="text" id="checkSintaxico"></section>
        </div>
    </div>

    <script src="Lexico.js" type="module"></script>
</body>
